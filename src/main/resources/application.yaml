spring:
  application:
    name: sentinel
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/sentinel}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
logging:
  structured:
    format:
      console: ecs
  level:
    org.jooq.tools.LoggerListener: WARN
springdoc:
  swagger-ui:
    path: /swagger-ui.html

sentinel:
  fraud:
    review-threshold: 40
    decline-threshold: 70
    large-amount-cents: 100000
    large-amount-risk: 35
    velocity-limit: 5
    velocity-window-seconds: 60
    velocity-risk: 30
    new-recipient-risk: 20
    minimum-history: 5
    deviation-multiplier: 3
    deviation-risk: 35
