name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and PostgreSQL integration tests
        env:
          # Deliberately reproduce a developer shell running the demo profile.
          SPRING_PROFILES_ACTIVE: demo
          DEMO_FUNDING_TOKEN: ci-profile-isolation-test-token
        run: mvn -B -ntp verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: UI typecheck, build and integer-money tests
        run: |
          npm ci --prefix web --no-fund --no-audit
          npm --prefix web test
          npm --prefix web run build
      - name: Install browser for actual UI verification
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Docker Compose API, UI and measured load
        env:
          RUN_UI_TESTS: 'true'
          RUN_LOAD_TEST: 'true'
        run: bash scripts/compose-smoke.sh
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/performance/
            web/playwright-report/
            web/test-results/
