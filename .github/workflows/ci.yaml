name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and PostgreSQL integration tests
        env:
          # Deliberately reproduce a developer shell running the demo profile.
          SPRING_PROFILES_ACTIVE: demo
          DEMO_FUNDING_TOKEN: ci-profile-isolation-test-token
        run: mvn -B -ntp verify
      - name: Docker Compose payment smoke
        run: bash scripts/compose-smoke.sh
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
